name: Publish

on:
  push:
    tags:
      - 'v*'
  # Called by create-tag.yml: tags pushed with GITHUB_TOKEN do not trigger
  # other workflows, so the tag-push trigger above never fires from there.
  workflow_call:
    inputs:
      ref:
        description: 'Tag to build and publish (e.g. v1.2.3)'
        required: true
        type: string
    secrets:
      PYPI_TOKEN:
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref || github.ref }}
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    
    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
        
    - name: Install dependencies and build tools
      run: |
        uv venv
        rm -rf dist
        uv pip install -e "."

    - name: Build package
      run: uv build
    
    - name: Publish to PyPI
      env:
        PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
      run: uv publish --token "$PYPI_TOKEN"
