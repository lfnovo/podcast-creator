[project]
name = "podcast-creator"
version = "0.12.0"
license = "MIT"
description = "AI-powered podcast generation tool that creates conversational audio content from text sources"
readme = "README.md"
requires-python = ">=3.10.6"
dependencies = [
    "ai-prompter>=0.3.1",
    "click>=8.0.0",
    "content-core>=1.14.1",
    "esperanto>=2.19.4",
    "langgraph>=1.0.6",
    "loguru>=0.7.3",
    "moviepy>=2.2.1",
    "nest-asyncio>=1.6.0",
    "edge-tts",
    "pydub>=0.25.1",
    "python-dotenv>=1.1.1",
    "requests>=2.0",
    "pycountry>=24.6.1",
    "tenacity>=8.2.0",
    "tiktoken>=0.9.0",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.44.0",
    "mutagen>=1.47.0",
]
mcp = [
    "mcp>=1.2.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.7",
    "langchain-anthropic>=1.3.1",
    "langchain-ollama>=1.0.1",
    "mcp>=1.2.0",
    "mypy>=1.16.1",
    "pip-audit>=2.9.0",
    "pytest>=8.4.1",
    "langchain-openai>=1.1.7",
    "ruff>=0.14.14",
    "watchdog>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/podcast_creator", "podcast_deck"]

[tool.hatch.build.targets.wheel.force-include]
"src/podcast_creator_cli_entry.py" = "podcast_creator_cli_entry.py"

# Keep venvs and local artifacts out of sdists (absolute symlinks break `uv build`).
[tool.hatch.build.targets.sdist]
exclude = [
    ".venv",
    ".venv_*",
    "venv",
    "output",
    "dist",
    ".pytest_cache",
    ".ruff_cache",
    "**/__pycache__",
]

[project.scripts]
podcast-creator = "podcast_creator_cli_entry:main"
podcast-creator-mcp = "podcast_creator_cli_entry:mcp_main"
